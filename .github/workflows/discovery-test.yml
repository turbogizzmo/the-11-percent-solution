name: Bright Data discovery test

# Tries the Menards scraper's "find products" modes, 3 products max each (about 6 credits).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
    steps:
      - name: Try each discovery mode
        run: |
          base="https://api.brightdata.com/datasets/v3/trigger?dataset_id=gd_motp6b7s1n9zlq6lwj&include_errors=true&type=discover_new&limit_per_input=3"
          try() {
            echo "== $1"
            curl -sS -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "$2" "$base&discover_by=$1" | tee -a out.txt
          }
          try category_url '{"input":[{"category_url":"https://www.menards.com/main/tools/hand-tools/measuring-layout-tools/tape-measures-rulers/c-1549901401002.htm"}]}'
          try keyword '{"input":[{"keyword":"AA batteries"}]}'
      - name: Wait for any snapshots and show what came back
        run: |
          for id in $(grep -o '"snapshot_id":"[^"]*"' out.txt | cut -d'"' -f4); do
            echo "== snapshot $id"
            for i in $(seq 1 40); do
              s=$(curl -sS -H "Authorization: Bearer $KEY" https://api.brightdata.com/datasets/v3/progress/$id)
              echo "$s"
              echo "$s" | grep -q '"ready"\|"failed"' && break
              sleep 20
            done
            curl -sS -H "Authorization: Bearer $KEY" "https://api.brightdata.com/datasets/v3/snapshot/$id?format=json" \
              | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(len(d),'rows')
          for r in d[:5]: print(r.get('price'), (r.get('title') or r.get('error') or '')[:80], r.get('url'))
          " || true
          done
