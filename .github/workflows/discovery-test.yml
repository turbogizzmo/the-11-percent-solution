name: Bright Data search test

# Compares search phrasings for finding Menards product pages (1 credit per search).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      ZONE: ${{ secrets.BRIGHTDATA_SERP_ZONE }}
    steps:
      - name: Try each phrasing
        shell: python3 {0}
        run: |
          import json, os, re, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          P = re.compile(r"^https://www\.menards\.com/main/.+/p-\d+")
          items = ["AA batteries 24 pack", "ice melt 50 lb", "furnace filter 16x25x1", "paper towels", "motor oil 5w-30 5 quart", "snow shovel"]
          def g(q, extra=""): return f"https://www.google.com/search?q={urllib.parse.quote(q)}&gl=us&hl=en&brd_json=1{extra}"
          def b(q): return f"https://www.bing.com/search?q={urllib.parse.quote(q)}&cc=us&brd_json=1"
          styles = {
            "google: menards <q>": lambda q: g("menards " + q),
            "google: <q> site:menards.com/main": lambda q: g(q + " site:menards.com/main"),
            "google: <q> as_sitesearch": lambda q: g(q, "&as_sitesearch=www.menards.com"),
            "bing: menards <q>": lambda q: b("menards " + q),
          }
          def run(args):
            name, q = args
            body = json.dumps({"zone": os.environ["ZONE"], "url": styles[name](q), "format": "raw"}).encode()
            req = urllib.request.Request("https://api.brightdata.com/request", body, {"Authorization": "Bearer " + os.environ["KEY"], "Content-Type": "application/json"})
            try:
              d = json.loads(urllib.request.urlopen(req, timeout=90).read())
              links = [r.get("link") or "" for r in d.get("organic") or []]
              prods = [l for l in links if P.match(l)]
              return name, q, len(prods), (prods[:2] or links[:2])
            except Exception as e:
              return name, q, -1, [str(e)[:80]]
          jobs = [(n, q) for n in styles for q in items]
          with ThreadPoolExecutor(6) as ex:
            res = list(ex.map(run, jobs))
          for n in styles:
            rows = [r for r in res if r[0] == n]
            print(f"\n== {n}: {sum(1 for r in rows if r[2] > 0)}/{len(rows)} found products")
            for _, q, c, l in rows: print(f"  {c:>2} {q}: {' '.join(x.split('/')[-3][:50] if 'menards' in x else x[:60] for x in l)}")
