name: Refresh Menards catalog

on:
  workflow_dispatch:
    inputs:
      find_only:
        description: "Only search for Menards products, skip pricing"
        type: boolean
        default: false
      limit:
        description: "Most ideas to search this run (blank = all)"
        type: string
        default: ""
      retry_missing:
        description: "Search again for ideas that found nothing before"
        type: boolean
        default: false
      new_only:
        description: "Price only products not already in the catalog"
        type: boolean
        default: false
  schedule:
    - cron: "0 9 2 * *" # 2nd of each month, so it lands after the free records reset on the 1st

permissions:
  contents: read

jobs:
  # Talks to Bright Data and pushes the new catalog. Holds the Bright Data key and a write token,
  # but never the Cloudflare token.
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Pull prices from Bright Data
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_SERP_ZONE: ${{ secrets.BRIGHTDATA_SERP_ZONE }}
          FIND_ONLY: ${{ inputs.find_only && '--find-only' || '' }}
          LIMIT: ${{ inputs.limit }}
          RETRY: ${{ inputs.retry_missing && '--retry-missing' || '' }}
          NEW_ONLY: ${{ inputs.new_only && '--new-only' || '' }}
        run: |
          # limit is free text, so only a whole number gets through, as a single argument.
          [[ "$LIMIT" =~ ^[0-9]*$ ]] || { echo "::error::limit must be a whole number or blank"; exit 1; }
          args=()
          for a in "$FIND_ONLY" "$RETRY" "$NEW_ONLY"; do [ -n "$a" ] && args+=("$a"); done
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          node scripts/refresh-catalog.mjs "${args[@]}"
      - name: Check catalog
        id: check
        if: always() # the product links are still worth keeping if pricing fails, as long as they check out
        run: node scripts/validate-catalog.mjs
      - name: Commit catalog
        id: commit
        if: ${{ always() && steps.check.outcome == 'success' }}
        run: |
          git config user.name turbogizzmo
          git config user.email 9514603+turbogizzmo@users.noreply.github.com
          git add catalog.json scripts/idea-urls.json
          git diff --cached --quiet || git commit -m "Refresh Menards catalog"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Deploys exactly the commit the refresh job pushed. Holds the Cloudflare token and runs no fetched-data code.
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Job-level so the steps' `if` can see it; a step's own env isn't visible to its `if`.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ env.CF_TOKEN != '' }}
        with:
          ref: ${{ needs.refresh.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ env.CF_TOKEN != '' }}
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler's exact version and dependency tree are pinned in .github/wrangler/package-lock.json.
          (cd .github/wrangler && npm ci --ignore-scripts --no-audit --no-fund)
          mkdir site && cp index.html sw.js _headers manifest.webmanifest icon.svg icon-192.png icon-512.png catalog.json ideas.json site/
          .github/wrangler/node_modules/.bin/wrangler pages deploy site --project-name=the-11-percent-solution --branch=main
