name: Refresh Menards catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 2 * *" # 2nd of each month, so it lands after the free records reset on the 1st

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull prices from Bright Data
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: node scripts/refresh-catalog.mjs
      - name: Commit catalog
        run: |
          git config user.name turbogizzmo
          git config user.email 9514603+turbogizzmo@users.noreply.github.com
          git add catalog.json
          git diff --cached --quiet || git commit -m "Refresh Menards catalog"
          git push
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir site && cp index.html sw.js _headers manifest.webmanifest icon.svg icon-192.png icon-512.png catalog.json site/
          npx --yes wrangler@4 pages deploy site --project-name=the-11-percent-solution --branch=main
