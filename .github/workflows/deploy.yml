name: Deploy site

# Puts the site on Cloudflare Pages whenever the website files change on main.
# (Catalog refreshes deploy from their own workflow, since pushes made by Actions don't start this one.)
on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - _headers
      - manifest.webmanifest
      - icon*
      - catalog.json
      - ideas.json
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.CF_TOKEN != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.CF_TOKEN != '' }}
        with:
          node-version: 20
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir site && cp index.html sw.js _headers manifest.webmanifest icon.svg icon-192.png icon-512.png catalog.json ideas.json site/
          npx --yes wrangler@4 pages deploy site --project-name=the-11-percent-solution --branch=main
      - name: Cloudflare secrets not set
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repo's Actions secrets to deploy automatically."
