name: Deploy site

# Puts the site on Cloudflare Pages whenever the website files change on main.
# (Catalog refreshes deploy from their own workflow, since pushes made by Actions don't start this one.)
on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - _headers
      - manifest.webmanifest
      - icon*
      - catalog.json
      - ideas.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ env.CF_TOKEN != '' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.CF_TOKEN != '' }}
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler's exact version and dependency tree are pinned in .github/wrangler/package-lock.json.
          (cd .github/wrangler && npm ci --ignore-scripts --no-audit --no-fund)
          mkdir site && cp index.html sw.js _headers manifest.webmanifest icon.svg icon-192.png icon-512.png catalog.json ideas.json site/
          .github/wrangler/node_modules/.bin/wrangler pages deploy site --project-name=the-11-percent-solution --branch=main
      - name: Cloudflare secrets not set
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repo's Actions secrets to deploy automatically."
